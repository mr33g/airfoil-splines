name: Build Release

on:
  workflow_dispatch:
    inputs:
      build_macos_x64:
        description: 'Build Intel macOS package (macos-13)'
        required: false
        default: 'false'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: airfoil-splines

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: airfoil-splines
          fetch-depth: 0

      - name: Checkout shared fitting library
        uses: actions/checkout@v4
        with:
          repository: mr33g/airfoil-splines-core
          ref: main
          token: ${{ secrets.AIRFOILFIT_READ_TOKEN }}
          path: airfoil-splines-core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: airfoil-splines/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Test application
        run: python -m unittest discover -s tests -v

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.UI.wixext/6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2

      - name: Build MSI
        run: |
          powershell -File setup\windows\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirfoilSplines-Windows
          path: airfoil-splines/dist/AirfoilSplines-*.msi

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: airfoil-splines/dist/AirfoilSplines-*.msi

  # macOS builds are disabled until we can test them locally.
